name: SeerApp
options:
  bundleIdPrefix: com.cedricziel.seer
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    ENABLE_USER_SCRIPT_SANDBOXING: false

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    exactVersion: "3.3.0"
  Get:
    url: https://github.com/kean/Get
    from: "2.2.1"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.0.0"
  JellyseerrAPI:
    path: Packages/JellyseerrAPI
  OpenTelemetrySwift:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: "2.6.0"
  OpenTelemetrySwiftCore:
    url: https://github.com/open-telemetry/opentelemetry-swift-core
    from: "2.6.0"
  PLCrashReporter:
    url: https://github.com/microsoft/plcrashreporter
    from: "1.11.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  SeerApp:
    type: application
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: App/SeerApp
        excludes:
          - "**/.DS_Store"
          - "Info*.plist"
      - path: Features
        excludes:
          - "**/.DS_Store"
          - Playback/PlayerControlsOverlay.swift
      - path: Features/Playback/PlayerControlsOverlay.swift
        destinationFilters: [iOS, macOS]
    dependencies:
      - package: Kingfisher
      - target: SeerCore
      - target: JellyfinClient
      - target: JellyseerrClient
      - target: SeerUI
      - target: PlaybackClient
      - target: OfflineSync
      - target: DownloadClient
      - target: NotificationClient
    capabilities:
      backgroundModes:
        modes:
          - audio
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_FILE: App/SeerApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": TVAppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=appletv*]": "3"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: Config/SeerApp.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/SeerApp-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/SeerApp-macOS.entitlements
        "INFOPLIST_FILE[sdk=macosx*]": App/SeerApp/Info-macOS.plist
        DEVELOPMENT_TEAM: WPW3QSLZ2F
        # Manual signing pinned to the match-managed profiles. Without
        # these, xcodebuild archive (run by gym) errors with "Automatic
        # signing is disabled and unable to generate a profile" because
        # match in readonly mode doesn't write to project.pbxproj and
        # xcodegen regenerates the project on every CI run.
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "match Development com.cedricziel.seer"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletv*]": "match Development com.cedricziel.seer tvos"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "match Development com.cedricziel.seer macos"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.cedricziel.seer"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletv*]": "match AppStore com.cedricziel.seer tvos"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "match AppStore com.cedricziel.seer macos"
    preBuildScripts:
      - name: SwiftLint
        runOnlyWhenInstalling: false
        shell: /bin/sh
        script: |
          cd "$SRCROOT"
          "$SRCROOT/scripts/swift-tools" swiftlint lint --quiet --no-cache

  SeerCore:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/SeerCore/Sources/SeerCore
        excludes:
          - "**/.DS_Store"
          - AppIntents/SpotlightIndexer.swift
      - path: Packages/SeerCore/Sources/SeerCore/AppIntents/SpotlightIndexer.swift
        destinationFilters: [iOS, macOS]
    dependencies:
      - package: OpenTelemetrySwiftCore
        product: OpenTelemetryApi
      - package: OpenTelemetrySwiftCore
        product: OpenTelemetrySdk
      - package: OpenTelemetrySwift
        product: OpenTelemetryProtocolExporterHTTP
      - package: OpenTelemetrySwift
        product: ResourceExtension
      - package: OpenTelemetrySwift
        product: SignPostIntegration
      - package: PLCrashReporter
        product: CrashReporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.core
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyfinClient:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/JellyfinClient/Sources/JellyfinClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: JellyfinAPI
      - package: Get
        product: Get
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyfinclient
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyseerrClient:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/JellyseerrClient/Sources/JellyseerrClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - package: JellyseerrAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyseerrclient
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  SeerUI:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/SeerUI/Sources/SeerUI
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.ui
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  PlaybackClient:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/PlaybackClient/Sources/PlaybackClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.playbackclient
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  OfflineSync:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/OfflineSync/Sources/OfflineSync
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.offlinesync
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  DownloadClient:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/DownloadClient/Sources/DownloadClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
      - target: PlaybackClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.downloadclient
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  NotificationClient:
    type: framework
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Packages/NotificationClient/Sources/NotificationClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyseerrClient
      - target: DownloadClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.notificationclient
        MARKETING_VERSION: "0.8.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  SeerCoreTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/SeerCoreTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - package: OpenTelemetrySwiftCore
        product: OpenTelemetryApi
      - package: OpenTelemetrySwiftCore
        product: OpenTelemetrySdk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.coretests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  PlaybackClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/PlaybackClientTests
        excludes:
          - "**/.DS_Store"
      - path: Tests/JellyfinClientTests/SDKStubServer.swift
    dependencies:
      - target: PlaybackClient
      - target: JellyfinClient
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.playbackclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  DownloadClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/DownloadClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: DownloadClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.downloadclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  JellyfinClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/JellyfinClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: JellyfinClient
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyfinclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  JellyseerrClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/JellyseerrClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: JellyseerrClient
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyseerrclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  NotificationClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/NotificationClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: NotificationClient
      - target: JellyseerrClient
      - target: DownloadClient
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.notificationclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  OfflineSyncTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/OfflineSyncTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: OfflineSync
      - target: SeerCore
      - target: JellyfinClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.offlinesynctests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # Host-based test bundle for Features/* code (currently OnboardingViewModel).
  # Uses TEST_HOST so tests can @testable import SeerApp. iOS-only because
  # SnapshotTesting renders through UIKit.
  AuthFeatureTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: Tests/AuthFeatureTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerApp
      - target: SeerCore
      - target: JellyfinClient
      - target: SeerUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.authfeaturetests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SeerApp.app/SeerApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Host-based test bundle for Features/Library code (PersonDetailView etc.).
  # Mirrors AuthFeatureTests so feature snapshot tests stay scoped to a
  # single feature. iOS-only because SnapshotTesting renders via UIKit.
  LibraryFeatureTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: Tests/LibraryFeatureTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerApp
      - target: SeerCore
      - target: JellyfinClient
      - target: JellyseerrClient
      - target: OfflineSync
      - target: DownloadClient
      - target: PlaybackClient
      - target: SeerUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.libraryfeaturetests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SeerApp.app/SeerApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # iOS-only because SnapshotTesting renders via UIKit (UIImage/UIWindow).
  # SeerUI itself supports tvOS; tvOS tests live in SeerUITestsTV.
  SeerUITests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: Tests/SeerUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.uiunittests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # tvOS-only counterpart for SeerUI snapshot tests that need tvOS rendering
  # (focus engine, TV-resolution layouts).
  SeerUITestsTV:
    type: bundle.unit-test
    supportedDestinations: [tvOS]
    sources:
      - path: Tests/SeerUITestsTV
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.uitestsTV
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # UI test target dedicated to driving the app for fastlane snapshot.
  # Not part of the regular `make test` pipeline because it depends on the
  # public Jellyfin demo server being reachable.
  SeerAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: Tests/SeerAppUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SeerApp

schemes:
  SeerApp:
    build:
      targets:
        SeerApp: all
        SeerCoreTests: [test]
        PlaybackClientTests: [test]
        DownloadClientTests: [test]
        JellyfinClientTests: [test]
        JellyseerrClientTests: [test]
        OfflineSyncTests: [test]
        NotificationClientTests: [test]
        SeerUITests: [test]
        AuthFeatureTests: [test]
        LibraryFeatureTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: true
        - variable: IDEPreferLogStreaming
          value: "YES"
          isEnabled: true
    test:
      config: Debug
      targets:
        - SeerCoreTests
        - PlaybackClientTests
        - DownloadClientTests
        - JellyfinClientTests
        - JellyseerrClientTests
        - OfflineSyncTests
        - NotificationClientTests
        - SeerUITests
        - AuthFeatureTests
        - LibraryFeatureTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Keep TV snapshots separate from the iOS-only snapshot test bundles.
  SeerUITestsTV:
    build:
      targets:
        SeerUI: all
        SeerUITestsTV: [test]
    test:
      config: Debug
      targets:
        - SeerUITestsTV

  # Dedicated scheme for fastlane snapshot. Builds the app + UI test target
  # only — kept out of the SeerApp scheme so `make test` doesn't try to talk
  # to the public Jellyfin demo on every run.
  SeerAppUITests:
    build:
      targets:
        SeerApp: all
        SeerAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeerAppUITests
