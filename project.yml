name: SeerApp
options:
  bundleIdPrefix: com.cedricziel.seer
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    from: "0.6.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.0.0"
  JellyseerrAPI:
    path: Packages/JellyseerrAPI
  OpenTelemetrySwift:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: "1.10.0"
  PLCrashReporter:
    url: https://github.com/microsoft/plcrashreporter
    from: "1.11.0"

targets:
  SeerApp:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: App/SeerApp
        excludes:
          - "**/.DS_Store"
      - path: Features
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: JellyfinAPI
      - package: Kingfisher
      - target: SeerCore
      - target: JellyfinClient
      - target: JellyseerrClient
      - target: SeerUI
      - target: PlaybackClient
      - target: OfflineSync
      - target: DownloadClient
      - target: NotificationClient
    entitlements:
      path: App/SeerApp/SeerApp.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cedricziel.seer"]
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.cedricziel.seer"
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.cedricziel.seer"]
        com.apple.developer.icloud-services: ["CloudKit"]
        com.apple.developer.networking.wifi-info: true
    capabilities:
      backgroundModes:
        modes:
          - audio
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_FILE: App/SeerApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        DEVELOPMENT_TEAM: WPW3QSLZ2F
    preBuildScripts:
      - name: SwiftLint
        runOnlyWhenInstalling: false
        shell: /bin/sh
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi

  SeerCore:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/SeerCore/Sources/SeerCore
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: OpenTelemetrySwift
        product: OpenTelemetryApi
      - package: OpenTelemetrySwift
        product: OpenTelemetrySdk
      - package: OpenTelemetrySwift
        product: StdoutExporter
      - package: OpenTelemetrySwift
        product: OpenTelemetryProtocolExporterHTTP
      - package: OpenTelemetrySwift
        product: ResourceExtension
      - package: PLCrashReporter
        product: CrashReporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.core
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyfinClient:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/JellyfinClient/Sources/JellyfinClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: JellyfinAPI
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyfinclient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyseerrClient:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/JellyseerrClient/Sources/JellyseerrClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - package: JellyseerrAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyseerrclient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  SeerUI:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/SeerUI/Sources/SeerUI
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.ui
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  PlaybackClient:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/PlaybackClient/Sources/PlaybackClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.playbackclient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  OfflineSync:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/OfflineSync/Sources/OfflineSync
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.offlinesync
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  DownloadClient:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/DownloadClient/Sources/DownloadClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyfinClient
      - target: PlaybackClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.downloadclient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  NotificationClient:
    type: framework
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Packages/NotificationClient/Sources/NotificationClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
      - target: JellyseerrClient
      - target: DownloadClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.notificationclient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 4
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  PlaybackClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/PlaybackClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: PlaybackClient
      - target: JellyfinClient
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.playbackclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  DownloadClientTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Tests/DownloadClientTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: DownloadClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.downloadclienttests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  SeerApp:
    build:
      targets:
        SeerApp: all
        PlaybackClientTests: [test]
        DownloadClientTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: true
        - variable: IDEPreferLogStreaming
          value: "YES"
          isEnabled: true
    test:
      config: Debug
      targets:
        - PlaybackClientTests
        - DownloadClientTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      preActions:
        - script: |
            cd "${PROJECT_DIR}"
            ./scripts/bump-build.sh
          name: Increment Build Number
          settingsTarget: SeerApp
