name: SeerApp
options:
  bundleIdPrefix: com.cedricziel.seer
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    from: "0.6.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.0.0"

targets:
  SeerApp:
    type: application
    platform: iOS
    sources:
      - path: App/SeerApp
        excludes:
          - "**/.DS_Store"
      - path: Features
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: JellyfinAPI
      - package: Kingfisher
      - target: SeerCore
      - target: JellyfinClient
      - target: JellyseerrClient
      - target: SeerUI
    entitlements:
      path: App/SeerApp/SeerApp.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cedricziel.seer"]
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.cedricziel.seer"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: App/SeerApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        DEVELOPMENT_TEAM: WPW3QSLZ2F
    preBuildScripts:
      - name: SwiftLint
        runOnlyWhenInstalling: false
        shell: /bin/sh
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi

  SeerCore:
    type: framework
    platform: iOS
    sources:
      - path: Packages/SeerCore/Sources/SeerCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.core
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyfinClient:
    type: framework
    platform: iOS
    sources:
      - path: Packages/JellyfinClient/Sources/JellyfinClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: JellyfinAPI
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyfinclient
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  JellyseerrClient:
    type: framework
    platform: iOS
    sources:
      - path: Packages/JellyseerrClient/Sources/JellyseerrClient
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.jellyseerrclient
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  SeerUI:
    type: framework
    platform: iOS
    sources:
      - path: Packages/SeerUI/Sources/SeerUI
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.seer.ui
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

schemes:
  SeerApp:
    build:
      targets:
        SeerApp: all
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: true
        - variable: IDEPreferLogStreaming
          value: "YES"
          isEnabled: true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
