name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  testflight:
    name: Upload to TestFlight
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install xcodegen
        run: brew install xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Provide stub Secrets.xcconfig
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
          fi

      - name: Configure SSH for match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID:                            ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                         ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:                       ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL:                         ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:                        ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD:               ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_HIDE_CHANGELOG:               "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT:  "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES:  "5"
        run: |
          bundle exec fastlane beta \
            allow_dirty:true \
            changelog:"Release ${{ needs.release-please.outputs.tag_name }}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SeerApp-${{ needs.release-please.outputs.tag_name }}
          path: build/*.ipa
          if-no-files-found: ignore
          retention-days: 30
