name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install tooling
        run: brew install swiftlint swiftformat

      - name: SwiftLint (strict)
        run: swiftlint lint --strict

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

  test:
    name: Build & Test
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache bundler
        uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Provide stub Secrets.xcconfig
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
          fi

      - name: Run tests
        run: bundle exec fastlane test
        env:
          SIMULATOR: iPhone 17
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"

      - name: Upload snapshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: |
            Tests/**/__Snapshots__/**/*.failure.png
            Tests/**/__Snapshots__/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload xcresult bundle (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
