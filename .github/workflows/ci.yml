name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test tooling bootstrap
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install tooling
        run: ./scripts/swift-tools setup

      - name: SwiftLint (strict)
        run: make lint

      - name: SwiftFormat (lint)
        run: ./scripts/swift-tools swiftformat --lint . --cache ignore

  test:
    name: Build & Test
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache bundler
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test release lanes
        run: ruby fastlane/tests/beta_test.rb

      - name: Provide Secrets.xcconfig
        env:
          OTLP_ENDPOINT:    ${{ secrets.OTLP_ENDPOINT }}
          OTLP_AUTH_HEADER: ${{ secrets.OTLP_AUTH_HEADER }}
          OTLP_TENANT_ID:   ${{ secrets.OTLP_TENANT_ID }}
          OTLP_DATASET_ID:  ${{ secrets.OTLP_DATASET_ID }}
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
          fi
          if [ -n "$OTLP_ENDPOINT" ] && [ -n "$OTLP_AUTH_HEADER" ]; then
            # xcconfig treats // as a comment; escape with /$()/ so the
            # URL survives Xcode's preprocessor when expanded into Info.plist.
            ENDPOINT_ESCAPED=$(printf '%s' "$OTLP_ENDPOINT" | sed 's|//|/$()/|g')
            {
              echo "OTLP_ENDPOINT = $ENDPOINT_ESCAPED"
              echo "OTLP_AUTH_HEADER = $OTLP_AUTH_HEADER"
              echo "OTLP_TENANT_ID = $OTLP_TENANT_ID"
              echo "OTLP_DATASET_ID = $OTLP_DATASET_ID"
            } >> Config/Secrets.xcconfig
            echo "OTLP endpoint configured"
          else
            echo "OTLP endpoint not configured (secrets unavailable) - telemetry disabled"
          fi

      - name: Run tests
        run: bundle exec fastlane test
        env:
          SIMULATOR: iPhone 17
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"

      - name: Upload snapshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            Tests/**/__Snapshots__/**/*.failure.png
            Tests/**/__Snapshots__/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload xcresult bundle (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  platform-build:
    name: Build ${{ matrix.destination }}
    runs-on: macos-26
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        destination: [iOS, tvOS, macOS]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate unsigned project
        run: |
          touch Config/Secrets.xcconfig
          xcodegen generate
      - name: Archive native app
        run: |
          xcodebuild -scheme SeerApp \
            -destination 'generic/platform=${{ matrix.destination }}' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -archivePath "$RUNNER_TEMP/SeerApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Validate runtime libraries
        run: python3 scripts/check_app_libraries.py "$RUNNER_TEMP/SeerApp.xcarchive"
