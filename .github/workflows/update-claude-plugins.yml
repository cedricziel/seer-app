name: Update Claude plugins
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: cedricziel/claude-plugins/actions/update-plugin@1a48515e819772e33a4ac8caa1719ced66eb5b93
        with:
          plugins: oss
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
