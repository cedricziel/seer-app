name: Update Claude plugins
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: cedricziel/claude-plugins/actions/update-plugin@bc53748a00f21f5aa3dd221e12c90ec69a7cce2c
        with:
          plugins: oss
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
