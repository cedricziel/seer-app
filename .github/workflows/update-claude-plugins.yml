name: Update Claude plugins
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: cedricziel/claude-plugins/actions/update-plugin@2f2634905cb3e181556e96e85d9141b00bd03638
        with:
          plugins: oss
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
