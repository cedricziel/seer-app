name: Update Claude plugins
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: cedricziel/claude-plugins/actions/update-plugin@414aeb4adf0af9d0ed962dfb7d4a67c884d36958
        with:
          plugins: oss
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
