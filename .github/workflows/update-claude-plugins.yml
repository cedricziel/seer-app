name: Update Claude plugins
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: cedricziel/claude-plugins/actions/update-plugin@b30beb9324f808081ca8c6a36c2c3597d1143158
        with:
          plugins: oss
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
