name: App Store Submission

# Fires when a GitHub Release is "graduated" from prerelease (TestFlight) to
# the latest release. release-please creates every release as a prerelease;
# clicking "Set as the latest release" on the GitHub release page fires
# `release: released` and lands here. Submits the existing TestFlight build
# for App Store review — no rebuild, no re-upload.

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  app-store:
    name: Submit to App Store
    runs-on: macos-26
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Compute build number from the tagged commit
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Submit existing TestFlight build to App Store
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          bundle exec fastlane submit_to_app_store \
            build:${{ steps.build.outputs.number }} \
            submit:true \
            auto_release:false
