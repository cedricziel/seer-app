version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Fastlane / Ruby toolchain
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      bundler:
        patterns: ["*"]

  # NOTE: The main app's external SPM dependencies (JellyfinAPI, Kingfisher,
  # OpenTelemetrySwift, PLCrashReporter, etc.) are declared in project.yml
  # and resolved by Xcode into SeerApp.xcodeproj/.../swiftpm/Package.resolved.
  # Dependabot's swift ecosystem requires a Package.swift in the target
  # directory and can't track Xcode-managed SPM directly. We commit the
  # resolved file for reproducibility. The weekly dependency-audit workflow
  # reports newer releases; refresh both lockfiles in a verified regular PR.

  # Local Swift package (external deps used by JellyseerrAPI)
  - package-ecosystem: "swift"
    directory: "/Packages/JellyseerrAPI"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      swift-jellyseerr-patches:
        update-types: ["patch"]
      swift-jellyseerr-minors:
        update-types: ["minor"]
